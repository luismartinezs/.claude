<!doctype html>
<meta charset="utf-8" />
<title>Orchestrator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;
    --panel: #ffffff;
    --line: #e6e2dc;
    --ink: #1b1a18;
    --dim: #6d675f;
    --accent: #2f6f4f;
    --warn: #9a5b1e;
    --stop: #97362c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1d1f23;
      --line: #2c2f35;
      --ink: #e8e6e3;
      --dim: #9a958d;
      --accent: #6fbf95;
      --warn: #d69a5c;
      --stop: #e0796b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 240px 1fr;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 0; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--dim); margin: 0 0 8px 16px; font-weight: 600; }
  .proj { padding: 7px 16px; cursor: pointer; display: flex; justify-content: space-between;
          gap: 8px; align-items: baseline; }
  .proj:hover { background: var(--panel); }
  .proj[aria-selected="true"] { background: var(--panel); box-shadow: inset 3px 0 var(--accent); }
  .proj small { color: var(--dim); font-size: 11px; }
  main { overflow-y: auto; padding: 22px 26px 40px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; font-weight: 620; }
  .meta { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--dim); }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.stop { color: var(--stop); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 20px; }
  .card.ask { border-color: var(--warn); }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card p { margin: 0 0 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { font: inherit; padding: 6px 10px; border-radius: 7px; flex: 1; min-width: 200px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); font-weight: 600; padding: 0 10px 6px 0; }
  td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); }
  td.num { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px;
         background: var(--line); vertical-align: middle; }
  .dot.green { background: var(--accent); }
  .dot.awaiting, .dot.paused { background: var(--warn); }
  .dot.failed { background: var(--stop); }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 14px; overflow-x: auto; font-size: 12px; line-height: 1.5;
        max-height: 320px; overflow-y: auto; margin: 0; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .empty { color: var(--dim); padding: 40px 0; }
  code { font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px;
         border: 1px solid var(--line); }
</style>

<aside>
  <h2>Projects</h2>
  <div id="projects"></div>
</aside>

<main id="main"><p class="empty">Pick a project.</p></main>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (path, body) =>
    fetch(path, { method: "POST", headers: { "content-type": "application/json" },
                  body: JSON.stringify(body) }).then((r) => r.json());

  let current = null;
  let stream = null;

  const money = (n) => "$" + (n ?? 0).toFixed(2);
  const mins = (ms) => (ms ? Math.round(ms / 60000) + "m" : "");

  async function loadProjects() {
    const list = await fetch("/api/projects").then((r) => r.json());
    $("projects").replaceChildren(
      ...list.map((p) => {
        const el = document.createElement("div");
        el.className = "proj";
        el.setAttribute("aria-selected", p.dir === current);
        el.innerHTML = `<span>${p.name}</span><small>${p.phase}</small>`;
        el.onclick = () => select(p.dir);
        return el;
      }),
    );
  }

  function select(dir) {
    current = dir;
    stream?.close();
    stream = new EventSource("/api/events?dir=" + encodeURIComponent(dir));
    stream.onmessage = (e) => render(JSON.parse(e.data));
    loadProjects();
  }

  function render(snap) {
    const s = snap.state;
    const park = s?.park ?? null;
    const rungs = snap.ladder?.rungs ?? [];
    const main = $("main");
    main.replaceChildren();

    const head = document.createElement("header");
    const title = document.createElement("h1");
    title.textContent = snap.name;
    const btn = document.createElement("button");
    btn.className = snap.running ? "stop" : "go";
    btn.textContent = snap.running ? "Stop" : s ? "Resume" : "Start";
    btn.onclick = () => post(snap.running ? "/api/stop" : "/api/start", { dir: snap.dir });
    head.append(title, btn);
    main.append(head);

    const meta = document.createElement("p");
    meta.className = "meta";
    const green = rungs.filter((r) => s?.rungs?.[r.id]?.status === "green").length;
    meta.textContent = !s
      ? "Nothing planned yet. Start it and it will interview you first."
      : `${green} of ${rungs.length || "?"} done, ${money(s.totalCostUsd)} spent` +
        (snap.running ? ", running now." : park ? ", waiting on you." : ".");
    main.append(meta);

    if (park) main.append(askCard(snap, park));
    if (rungs.length) main.append(ladderTable(snap, rungs));

    const log = document.createElement("details");
    log.open = snap.running && !park;
    log.innerHTML = "<summary>Output</summary>";
    const pre = document.createElement("pre");
    pre.textContent = (snap.log ?? []).join("") || "nothing yet";
    log.append(pre);
    main.append(log);
    pre.scrollTop = pre.scrollHeight;
  }

  function askCard(snap, park) {
    const card = document.createElement("div");
    card.className = "card ask";
    const h = document.createElement("h3");
    h.textContent = { human: "Your call", question: "It asked you something",
                      conversation: "This part is a conversation", derail: "It is stuck",
                      tautology: "This check proves nothing", budget: "Budget reached",
                      error: "It could not proceed" }[park.kind] ?? park.kind;
    const p = document.createElement("p");
    p.textContent = park.message;
    card.append(h, p);

    if (park.detail && park.kind !== "conversation") {
      const pre = document.createElement("pre");
      pre.textContent = park.detail;
      pre.style.marginBottom = "12px";
      card.append(pre);
    }

    if (snap.terminalOpen) {
      const open = document.createElement("p");
      open.style.color = "var(--warn)";
      open.style.margin = "0";
      open.textContent =
        "A terminal is open for this. Finish there and exit Claude; it carries on by itself.";
      card.append(open);
      return card;
    }

    const actions = document.createElement("div");
    actions.className = "actions";
    const sessions = snap.state?.rungs?.[park.rungId]?.sessions ?? [];
    const last = sessions[sessions.length - 1];

    if (park.kind === "conversation") {
      const go = document.createElement("button");
      go.className = "go";
      go.textContent = "Open the conversation";
      go.onclick = async () => {
        go.textContent = "Opened in a terminal";
        await post("/api/converse", { dir: snap.dir, rung: park.rungId });
      };
      const hint = document.createElement("span");
      hint.style.color = "var(--dim)";
      hint.style.fontSize = "12px";
      hint.textContent = "It picks up by itself when you close the terminal.";
      const done = document.createElement("button");
      done.textContent = "Carry on now";
      done.onclick = () => post("/api/resume", { dir: snap.dir });
      actions.append(go, done, hint);
    }

    if (park.kind === "human") {
      const note = document.createElement("input");
      note.type = "text";
      note.placeholder = "what is wrong with it (only needed to reject)";
      const yes = document.createElement("button");
      yes.className = "go";
      yes.textContent = "Ship it";
      yes.onclick = () => post("/api/answer", { dir: snap.dir, rung: park.rungId, pass: "yes" });
      const no = document.createElement("button");
      no.className = "stop";
      no.textContent = "Redo it";
      no.onclick = () =>
        post("/api/answer", { dir: snap.dir, rung: park.rungId, pass: "no", note: note.value });
      actions.append(yes, no, note);
    }

    if (last) {
      const open = document.createElement("button");
      open.textContent = park.kind === "human" ? "Talk to the session" : "Open the session";
      open.onclick = async () => {
        open.textContent = "Opened in a terminal";
        await post("/api/session", { dir: snap.dir, session: last });
      };
      actions.append(open);
    }

    if (park.kind === "tautology") {
      const fix = document.createElement("button");
      fix.className = "go";
      fix.textContent = "Fix the check";
      fix.onclick = async () => {
        fix.textContent = "Opened in a terminal";
        await post("/api/fixcheck", { dir: snap.dir, rung: park.rungId });
      };
      const anyway = document.createElement("button");
      anyway.textContent = "The work is already done, carry on";
      anyway.onclick = () => post("/api/override", { dir: snap.dir, rung: park.rungId });
      actions.append(fix, anyway);
    }

    if (["budget", "error", "derail", "question"].includes(park.kind)) {
      const again = document.createElement("button");
      again.textContent = "Try again";
      again.onclick = () => post("/api/resume", { dir: snap.dir });
      actions.append(again);
    }

    card.append(actions);
    return card;
  }

  function ladderTable(snap, rungs) {
    const table = document.createElement("table");
    table.innerHTML =
      "<thead><tr><th>Rung</th><th>Covers</th><th class='num'>Tries</th>" +
      "<th class='num'>Cost</th><th class='num'>Time</th></tr></thead>";
    const body = document.createElement("tbody");
    for (const r of rungs) {
      const st = snap.state?.rungs?.[r.id] ?? {};
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td><span class="dot ${st.status ?? ""}"></span>${r.id} ${r.name}</td>` +
        `<td>${(r.milestones ?? []).join(", ")}</td>` +
        `<td class="num">${st.attempts || ""}</td>` +
        `<td class="num">${st.costUsd ? money(st.costUsd) : ""}</td>` +
        `<td class="num">${mins(st.wallMs)}</td>`;
      body.append(tr);
    }
    table.append(body);
    return table;
  }

  loadProjects();
  setInterval(loadProjects, 10000);
</script>
